name: 05 - Terraform Validate

# Infrastructure as Code stage of the pipeline: catches malformed HCL,
# provider/schema errors, and formatting drift on every change to the
# Terraform configuration, before anyone runs it against real Azure
# resources.
#
# Scope note: this job runs `fmt` and `validate` only - it does NOT run
# `terraform plan` or `terraform apply` in CI. Both need full Azure
# Resource Manager authentication (an Entra service principal or OIDC
# federation), which this student tenant blocks - the same restriction
# documented for `azure/login` in 01-ci.yml and 02/03/04. `validate` and
# `fmt` need no cloud credentials at all, so they can run safely and
# unconditionally on every push. `plan`/`apply` remain a manual, locally
# run step (see SETUP.md).

on:
  push:
    paths:
      - "terraform/**"
      - ".github/workflows/05-terraform.yml"
  workflow_dispatch:

jobs:
  terraform-validate:
    name: Validate Terraform configuration
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform format check
        run: terraform fmt -check -recursive -diff

      - name: Terraform init (no backend, no cloud credentials)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate
